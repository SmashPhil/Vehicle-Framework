name: build

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

env:
  PROJECT_PATH: "Source/Vehicles/Vehicles.sln"
  VERSION_MAJOR: "1"
  VERSION_MINOR: "6"
  PROJECT_START: "07-DEC-2019"

jobs:
  build:
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Generate Build Version
        shell: bash
        run: |
          chmod +x Build/IncrementVersion.sh
          Build/IncrementVersion.sh "$VERSION_MAJOR" "$VERSION_MINOR" "$PROJECT_START" true true

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore Packages
        run: dotnet restore "$PROJECT_PATH" -p:UseKrafsPackageRef=true
        
      - name: Compile
        run: dotnet build "$PROJECT_PATH" --configuration Debug --no-restore -p:UseKrafsPackageRef=true

      - name: Extract Localization Files
        shell: bash
        run: |
          chmod +x Build/ExtractTranslations.sh
          Build/ExtractTranslations.sh "${VERSION_MAJOR}.${VERSION_MINOR}"

      - name: Get Build Version
        run: |
          VERSION=$(cat Version.txt)
          ARTIFACT_NAME="Vehicle-Framework-v$VERSION"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            1.4
            1.5
            1.6
            About
            LegacyTextures
            Sounds
            Updates
            Version.txt
            BuildDate.txt
            TestConfig.xml
            LICENSE
            LoadFolders.xml